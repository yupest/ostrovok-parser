name: Ostrovok Parser

on:
  schedule:
    # Запуск ежедневно в 08:00 UTC (16:00 по Иркутску)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Ручной запуск из вкладки Actions

permissions:
  contents: write

concurrency:
  group: ostrovok-daily-collection
  cancel-in-progress: false

jobs:
  parse-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Test pagination
        run: python -m unittest discover -s tests -v

      - name: Run Ostrovok hotels parser
        run: python -u ostrovok_hotels.py
        env:
          RUN_TZ: Asia/Irkutsk
          PYTHONUNBUFFERED: 1

      - name: Run Ostrovok rooms parser
        run: python -u ostrovok_rooms.py
        env:
          RUN_TZ: Asia/Irkutsk
          PYTHONUNBUFFERED: 1

      - name: Run Ostrovok statistic
        run: python -u ostrovok_statistic.py
        env:
          RUN_TZ: Asia/Irkutsk
          PYTHONUNBUFFERED: 1

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and push daily tables and logs
        run: |
          git add daily/ logs/ catalog/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Ostrovok daily data - $(date +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
